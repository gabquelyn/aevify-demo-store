# Admit in Docker.
#   docker compose up              store on http://localhost:3001 (hot reload) + a local MongoDB
#   docker compose run --rm store npm test
#   docker compose run --rm store npm run agent
#   docker compose --profile prod up store-prod   the production image on http://localhost:3002

services:
  store:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - store_node_modules:/app/node_modules
      - store_next:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Aevify running on your machine
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  store-prod:
    profiles: ["prod"]
    build: .
    ports:
      - "3002:3001"
    env_file:
      - path: .env
        required: false
    depends_on:
      - mongo

volumes:
  store_node_modules:
  store_next:
  mongo_data:
